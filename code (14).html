<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ежедневник - Планировщик</title>
    <!-- Библиотека ical.js для чтения .ics файлов прямо в браузере -->
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/ical.js/1.5.0/ical.min.js"></script>
    <style>
      :root {
        --bg-color: #121212;
        --card-bg: #1a1a1a;
        --border-color: #262626;
        --accent-orange: #ffa500;
        --text-gray: #888888;
      }

      * { box-sizing: border-box; }

      body {
        background-color: var(--bg-color);
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .header-container { width: 100%; max-width: 1200px; text-align: left; margin-bottom: 15px; }
      .journal-title { color: var(--accent-orange); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold; margin: 0; }
      .planner-title { font-size: 32px; font-weight: bold; margin: 5px 0 0 0; }

      .nav-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1200px;
        margin-bottom: 15px;
        flex-wrap: wrap;
        gap: 10px;
      }

      .nav-buttons { display: flex; gap: 10px; }
      .nav-btn {
        background-color: #1e1e1e; color: #aaaaaa; border: 1px solid var(--border-color);
        padding: 9px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.2s ease;
      }
      .nav-btn.active { background-color: #2a2420; color: #ffffff; border-color: var(--accent-orange); }

      .week-nav-container {
        display: flex; align-items: center; gap: 8px; background: #181818; padding: 4px; border-radius: 10px; border: 1px solid var(--border-color);
      }
      .week-nav-btn { background: #222; border: 1px solid var(--border-color); color: #ccc; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
      .week-nav-btn:hover { background: #333; color: #fff; }
      .week-range-label { font-size: 13px; font-weight: 500; color: var(--accent-orange); padding: 0 8px; min-width: 180px; text-align: center; }

      .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; }
      .add-btn { background-color: var(--accent-orange); color: #000; font-weight: bold; border: none; padding: 9px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .add-btn:hover { background-color: #ffb733; }
      .import-btn { background-color: #1e2942; color: #61afef; border: 1px solid #2e3f66; font-weight: bold; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .copy-btn { background-color: #2a2420; color: var(--accent-orange); border: 1px solid var(--accent-orange); font-weight: bold; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
      .clear-btn { background-color: #2d1818; color: #ff6b6b; border: 1px solid #5e2f2f; font-weight: bold; padding: 9px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }

      .date-time-container {
        display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 1200px;
        padding-bottom: 12px; margin-bottom: 20px; border-bottom: 2px solid var(--accent-orange); font-size: 14px;
      }
      .today-label { font-weight: 600; color: #ffffff; }
      .time-badges { display: flex; gap: 10px; }
      .time-badge { background: #1e1e1e; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-color); font-family: monospace; color: #ccc; }

      #view-week { width: 100%; max-width: 1200px; overflow-x: auto; }
      table.week-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      th.time-col, td.time-cell { width: 85px; text-align: center; color: var(--text-gray); font-size: 11px; font-weight: bold; }
      th.day-col { border-bottom: 1px solid var(--border-color); padding: 10px 5px; text-align: center; }
      .day-name { font-size: 12px; color: var(--text-gray); }
      .day-num { font-size: 18px; font-weight: bold; }
      th.day-col.is-today { background-color: #2b2219; border-radius: 8px 8px 0 0; }
      th.day-col.is-today .day-num { color: var(--accent-orange); }

      td.slot-cell { border: 1px solid var(--border-color); vertical-align: top; padding: 3px; height: 110px; }
      .slot-wrapper { display: flex; gap: 4px; width: 100%; height: 100%; }

      .grid-card {
        flex: 1; min-width: 0; height: 100%; border-radius: 8px; padding: 6px 8px; font-size: 11px;
        display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; overflow: hidden;
        transition: filter 0.2s, opacity 0.2s; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
      }
      .grid-card:hover { filter: brightness(1.25); }
      .grid-card.is-done { opacity: 0.6; }

      .card-header-line { display: flex; justify-content: space-between; align-items: center; }
      .grid-card-time { font-size: 10px; opacity: 0.85; font-weight: bold; }
      .grid-card-title { font-weight: 600; margin-top: 2px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; }
      .grid-card-sub { font-size: 10px; color: #bbb; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      .hw-badge { font-size: 10px; color: #ffb733; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hw-badge.done { color: #51cf66; text-decoration: line-through; }
      .hw-checkbox { cursor: pointer; width: 14px; height: 14px; accent-color: var(--accent-orange); }

      .card-link-btn {
        display: inline-flex; align-items: center; gap: 3px; background-color: rgba(97, 175, 239, 0.2);
        color: #61afef; border: 1px solid #2e3f66; padding: 2px 6px; border-radius: 5px; font-size: 10px;
        text-decoration: none; margin-top: 3px; font-weight: 600; width: fit-content;
      }
      .card-link-btn:hover { background-color: #61afef; color: #000; }

      #view-day { width: 100%; max-width: 600px; display: none; flex-direction: column; gap: 15px; }
      .day-selector-strip { display: flex; justify-content: space-between; gap: 6px; background-color: #181818; padding: 8px; border-radius: 12px; border: 1px solid var(--border-color); }
      .day-tab { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: 8px; cursor: pointer; background: #222; color: #888; }
      .day-tab.active { background-color: var(--accent-orange); color: #000; font-weight: bold; }
      .day-tab-name { font-size: 11px; text-transform: uppercase; }
      .day-tab-num { font-size: 16px; margin-top: 2px; }

      .day-cards-list { display: flex; flex-direction: column; gap: 12px; }
      .day-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-left: 4px solid var(--accent-orange); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
      .day-card.is-done { opacity: 0.6; }
      .day-card-header { display: flex; justify-content: space-between; align-items: center; }
      .day-card-time { font-size: 15px; color: #e0e0e0; font-weight: 500; }
      .day-card-badge { background-color: #2a2a2a; color: #aaa; padding: 4px 10px; border-radius: 6px; font-size: 12px; }
      .day-card-title { font-size: 16px; font-weight: bold; color: #fff; }
      .day-card-type { font-size: 13px; color: var(--text-gray); }
      .day-card-info { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #bbb; }
      .info-row { display: flex; align-items: center; gap: 8px; }

      .hw-row { background: rgba(255, 165, 0, 0.1); border: 1px solid rgba(255, 165, 0, 0.3); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ffb733; }
      .hw-row.done { background: rgba(81, 207, 102, 0.1); border-color: rgba(81, 207, 102, 0.3); color: #51cf66; text-decoration: line-through; }

      .grid-card.green, .day-card.green { border-left: 3px solid #236356; background-color: #132420; }
      .grid-card.blue, .day-card.blue { border-left: 3px solid #2e3f66; background-color: #141c2b; }
      .grid-card.purple, .day-card.purple { border-left: 3px solid #4a3559; background-color: #201726; }
      .grid-card.red, .day-card.red { border-left: 3px solid #5e2f2f; background-color: #261515; }
      .grid-card.orange, .day-card.orange { border-left: 3px solid #8c5311; background-color: #382309; }

      .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
      .modal-box { background-color: #1e1e1e; border: 1px solid var(--border-color); border-radius: 14px; padding: 24px; width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 14px; }
      .modal-title { font-size: 20px; font-weight: bold; color: var(--accent-orange); }
      .form-group { display: flex; flex-direction: column; gap: 5px; }
      .form-group label { font-size: 12px; color: var(--text-gray); }
      .form-control { background-color: #121212; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 8px; outline: none; font-size: 14px; }
      .form-row { display: flex; gap: 10px; }
      .form-row .form-group { flex: 1; }
      .modal-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
      .right-buttons { display: flex; gap: 10px; }
      .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: #888; padding: 10px 16px; border-radius: 8px; cursor: pointer; }
      .btn-delete { background: #3a1d1d; border: 1px solid #5e2f2f; color: #ff6b6b; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
      .btn-save { background: var(--accent-orange); color: #000; font-weight: bold; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
    </style>
  </head>
  <body>

    <datalist id="list-time-str"></datalist>
    <datalist id="list-pair"></datalist>
    <datalist id="list-type"></datalist>
    <datalist id="list-location"></datalist>
    <datalist id="list-teacher"></datalist>
    <datalist id="list-subject"></datalist>

    <div class="header-container">
      <p class="journal-title">Ежедневник</p>
      <h1 class="planner-title">Планировщик</h1>
    </div>

    <div class="nav-bar">
      <div class="nav-buttons">
        <button class="nav-btn" id="btn-day">День</button>
        <button class="nav-btn active" id="btn-week">Неделя</button>
      </div>

      <div class="week-nav-container">
        <button class="week-nav-btn" id="btn-prev-week">←</button>
        <button class="week-nav-btn" id="btn-today-week">Текущая</button>
        <span class="week-range-label" id="week-range-text">...</span>
        <button class="week-nav-btn" id="btn-next-week">→</button>
      </div>

      <div class="action-buttons">
        <button class="import-btn" id="btn-open-import">📅 Импорт из УрФУ (.ics)</button>
        <button class="clear-btn" id="btn-clear-week">🗑 Стереть неделю</button>
        <button class="copy-btn" id="btn-copy-week">📋 Скопировать неделю</button>
        <button class="add-btn" id="btn-add-event"><span>+</span> Добавить пару</button>
      </div>
    </div>

    <div class="date-time-container">
      <span class="today-label" id="today-date-text">Сегодня: ...</span>
      <div class="time-badges">
        <span id="utc5-time" class="time-badge">UTC+5: --:--</span>
        <span id="utc3-time" class="time-badge">UTC+3: --:--</span>
      </div>
    </div>

    <div id="view-week">
      <table class="week-table">
        <thead><tr id="week-table-header"></tr></thead>
        <tbody id="week-table-body"></tbody>
      </table>
    </div>

    <div id="view-day">
      <div class="day-selector-strip" id="day-strip"></div>
      <div class="day-cards-list" id="day-cards-container"></div>
    </div>

    <!-- МОДАЛКА ИМПОРТА -->
    <div class="modal-overlay" id="modal-import">
      <div class="modal-box">
        <div class="modal-title">Импорт расписания из УрФУ</div>
        <p style="font-size: 12px; color: #aaa; margin:0;">Загрузите файл <b>calendar.ics</b> с сайта УрФУ.</p>
        <div class="form-group">
          <label>Выберите файл calendar.ics с диска</label>
          <input type="file" id="inp-ics-file" accept=".ics" class="form-control">
        </div>
        <div class="modal-buttons">
          <div></div>
          <div class="right-buttons">
            <button class="btn-cancel" id="btn-close-import">Отмена</button>
            <button class="btn-save" id="btn-submit-import">Загрузить</button>
          </div>
        </div>
      </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="modal-add">
      <div class="modal-box">
        <div class="modal-title" id="modal-heading">Новая пара / событие</div>
        <div class="form-group">
          <label>Название предмета</label>
          <input type="text" id="inp-subject" class="form-control" list="list-subject" placeholder="Детали машин">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>День недели</label>
            <select id="inp-day" class="form-control">
              <option value="0">Понедельник</option><option value="1">Вторник</option><option value="2">Среда</option>
              <option value="3">Четверг</option><option value="4">Пятница</option><option value="5">Суббота</option><option value="6">Воскресенье</option>
            </select>
          </div>
          <div class="form-group">
            <label>Время проведения</label>
            <input type="text" id="inp-time-str" class="form-control" list="list-time-str" placeholder="10:15 – 11:45">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Номер пары</label>
            <input type="text" id="inp-pair" class="form-control" list="list-pair" placeholder="1 пара">
          </div>
          <div class="form-group">
            <label>Тип занятия</label>
            <input type="text" id="inp-type" class="form-control" list="list-type" placeholder="Практические занятия">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Аудитория</label>
            <input type="text" id="inp-location" class="form-control" list="list-location" placeholder="М526 Мира, 19">
          </div>
          <div class="form-group">
            <label>Преподаватель</label>
            <input type="text" id="inp-teacher" class="form-control" list="list-teacher" placeholder="Парышев С.В.">
          </div>
        </div>
        <div class="form-group">
          <label>Ссылка на онлайн-занятие</label>
          <input type="text" id="inp-link" class="form-control" placeholder="https://bbb.urfu.ru/rooms/...">
        </div>
        <div class="form-group">
          <label>📝 Домашнее задание</label>
          <input type="text" id="inp-homework" class="form-control" placeholder="Решить задачи">
        </div>
        <div class="form-group">
          <label>Цвет плашки</label>
          <select id="inp-color" class="form-control">
            <option value="green">Бирюзовый</option><option value="blue">Синий</option>
            <option value="purple">Фиолетовый</option><option value="red">Красно-коричневый</option><option value="orange">Оранжевый</option>
          </select>
        </div>
        <div class="modal-buttons">
          <button class="btn-delete" id="btn-delete-event" style="display: none;">Удалить</button>
          <div class="right-buttons">
            <button class="btn-cancel" id="btn-cancel-modal">Отмена</button>
            <button class="btn-save" id="btn-save-event">Сохранить</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      let events = JSON.parse(localStorage.getItem('schedule_events')) || [
        { id: 1, weekOffset: 0, day: 0, slotIdx: 1, timeStr: '10:15 – 11:45', pair: '2 пара', subject: 'Пример пары', type: 'Лекция', location: 'М422', teacher: 'Преподаватель', link: '', homework: '', isDone: false, color: 'blue' }
      ];
      let currentWeekOffset = 0;
      let activeDayIndex = 0;
      let currentView = 'week';
      let editingEventId = null;

      const slotsConfig = [
        { label: '08:30 – 10:00' }, { label: '10:15 – 11:45' }, { label: '12:00 – 13:30' },
        { label: '14:15 – 15:45' }, { label: '16:10 – 17:40' }, { label: '18:00 – 19:30' }, { label: '19:40 – 21:10' }
      ];

      function saveEvents() {
        localStorage.setItem('schedule_events', JSON.stringify(events));
        updateDatalists();
      }

      function getSlotIndexFromTime(timeStr) {
        if (!timeStr || timeStr.includes("Асинхронно") || timeStr.includes("Онлайн")) return 0;
        const match = timeStr.match(/(\d{1,2}):(\d{2})/);
        if (match) {
          const mins = parseInt(match[1]) * 60 + parseInt(match[2]);
          if (mins <= 560) return 0;
          if (mins <= 660) return 1;
          if (mins <= 780) return 2;
          if (mins <= 910) return 3;
          if (mins <= 1020) return 4;
          if (mins <= 1130) return 5;
          return 6;
        }
        return 0;
      }

      function getWeekDates(offset = 0) {
        const now = new Date();
        const currentDayOfWeek = (now.getDay() + 6) % 7;
        const monday = new Date(now);
        monday.setDate(now.getDate() - currentDayOfWeek + (offset * 7));
        const dates = [];
        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          dates.push({ name: dayNames[i], num: d.getDate(), isToday: isSameDay(d, new Date()) });
        }
        return { dates, monday, sunday: new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6) };
      }

      function isSameDay(d1, d2) {
        return d1.getFullYear() === d2.getFullYear() && d1.getMonth() === d2.getMonth() && d1.getDate() === d2.getDate();
      }

      function updateDatalists() {
        const getUnique = (key) => [...new Set(events.map(e => e[key]).filter(Boolean))];
        fillDatalist('list-subject', getUnique('subject'));
        fillDatalist('list-time-str', getUnique('timeStr'));
        fillDatalist('list-pair', getUnique('pair'));
        fillDatalist('list-type', getUnique('type'));
        fillDatalist('list-location', getUnique('location'));
        fillDatalist('list-teacher', getUnique('teacher'));
      }

      function fillDatalist(id, values) {
        const dl = document.getElementById(id);
        if(!dl) return;
        dl.innerHTML = '';
        values.forEach(v => { const opt = document.createElement('option'); opt.value = v; dl.appendChild(opt); });
      }

      // Парсинг .ics прямо в браузере
      document.getElementById('btn-open-import').onclick = () => document.getElementById('modal-import').style.display = 'flex';
      document.getElementById('btn-close-import').onclick = () => document.getElementById('modal-import').style.display = 'none';

      document.getElementById('btn-submit-import').onclick = () => {
        const fileInput = document.getElementById('inp-ics-file');
        if (fileInput.files.length === 0) { alert('Выберите файл .ics'); return; }
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const jcalData = ICAL.parse(e.target.result);
            const comp = new ICAL.Component(jcalData);
            const vevents = comp.getAllSubcomponents('vevent');
            
            const now = new Date();
            const currentMonday = new Date(now);
            currentMonday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
            currentMonday.setHours(0,0,0,0);

            let added = 0;
            vevents.forEach(vev => {
              const summary = vev.getFirstPropertyValue('summary') || '';
              const dtstart = vev.getFirstPropertyValue('dtstart');
              const dtend = vev.getFirstPropertyValue('dtend');
              const location = vev.getFirstPropertyValue('location') || '';
              const description = vev.getFirstPropertyValue('description') || '';

              if (!dtstart) return;

              let startDate = dtstart.toJSDate();
              // Перевод UTC в Екатеринбург (+5 часов)
              startDate.setHours(startDate.getHours() + 5);
              let endDate = dtend ? dtend.toJSDate() : new Date(startDate.getTime() + 90*60000);
              endDate.setHours(endDate.getHours() + 5);

              const eventMonday = new Date(startDate);
              eventMonday.setDate(startDate.getDate() - startDate.getDay() + (startDate.getDay() === 0 ? -6 : 1));
              eventMonday.setHours(0,0,0,0);
              const weekOffset = Math.round((eventMonday - currentMonday) / (7 * 24 * 3600 * 1000));
              const dayIdx = (startDate.getDay() + 6) % 7;

              let pairBadge = "Пара";
              let subjectClean = summary;
              const match = summary.match(/^(\d+)\.\s*(.*)/);
              if (match) {
                pairBadge = match[1] !== "0" ? `${match[1]} пара` : "Онлайн";
                subjectClean = match[2];
              }

              const urlMatch = (description + " " + location).match(/https?:\/\/[^\s<>\"']+/);
              const linkUrl = urlMatch ? urlMatch[0].replace(/[.,;)]$/, '') : '';

              const cleanDesc = description.replace(linkUrl, '').trim();
              const lines = cleanDesc.split('\n').filter(l => l.trim());
              const type = lines[0] || 'Занятие';
              const teacher = lines[1] || '';

              const startMins = startDate.getHours() * 60 + startDate.getMinutes();
              const slotIdx = getSlotIndexFromTime(`${startDate.getHours().toString().padStart(2,'0')}:${startDate.getMinutes().toString().padStart(2,'0')}`);
              const timeStr = `${startDate.getHours().toString().padStart(2,'0')}:${startDate.getMinutes().toString().padStart(2,'0')} – ${endDate.getHours().toString().padStart(2,'0')}:${endDate.getMinutes().toString().padStart(2,'0')}`;

              let color = 'blue';
              const comb = (subjectClean + " " + type).toLowerCase();
              if (comb.includes('лекци')) color = 'green';
              else if (comb.includes('лаб')) color = 'purple';
              else if (comb.includes('практ') || comb.includes('физическая')) color = 'blue';
              else if (comb.includes('онлайн') || comb.includes('проект')) color = 'orange';

              const newEv = {
                id: startDate.getTime() + Math.random(),
                weekOffset, day: dayIdx, slotIdx, span: 1,
                timeStr, pair: pairBadge, subject: subjectClean, type, location, teacher,
                link: linkUrl, homework: '', isDone: false, color
              };

              if (!events.some(ex => ex.subject === newEv.subject && ex.day === newEv.day && ex.slotIdx === newEv.slotIdx && ex.weekOffset === newEv.weekOffset)) {
                events.push(newEv);
                added++;
              }
            });

            saveEvents();
            document.getElementById('modal-import').style.display = 'none';
            alert(`Импортировано занятий: ${added}`);
            renderCurrentView();
          } catch(err) {
            alert('Ошибка чтения .ics файла: ' + err.message);
          }
        };
        reader.readAsText(fileInput.files[0]);
      };

      window.toggleDoneStatus = function(id, e) {
        e.stopPropagation();
        const ev = events.find(x => x.id === id);
        if (ev) { ev.isDone = !ev.isDone; saveEvents(); renderCurrentView(); }
      };

      document.getElementById('btn-clear-week').onclick = () => {
        const cur = events.filter(e => (e.weekOffset ?? 0) === currentWeekOffset);
        if (confirm(`Стереть ${cur.length} пар текущей недели?`)) {
          events = events.filter(e => (e.weekOffset ?? 0) !== currentWeekOffset);
          saveEvents(); renderCurrentView();
        }
      };

      document.getElementById('btn-copy-week').onclick = () => {
        const cur = events.filter(e => (e.weekOffset ?? 0) === currentWeekOffset);
        if (cur.length === 0) { alert('Нет пар для копирования'); return; }
        const target = currentWeekOffset + 1;
        events = events.filter(e => (e.weekOffset ?? 0) !== target);
        cur.forEach(e => events.push({ ...e, id: Date.now() + Math.random(), weekOffset: target, isDone: false }));
        saveEvents(); currentWeekOffset = target; renderCurrentView();
      };

      document.getElementById('btn-prev-week').onclick = () => { currentWeekOffset--; renderCurrentView(); };
      document.getElementById('btn-next-week').onclick = () => { currentWeekOffset++; renderCurrentView(); };
      document.getElementById('btn-today-week').onclick = () => { currentWeekOffset = 0; renderCurrentView(); };

      document.getElementById('btn-day').onclick = () => {
        currentView = 'day'; document.getElementById('btn-day').classList.add('active'); document.getElementById('btn-week').classList.remove('active');
        document.getElementById('view-week').style.display = 'none'; document.getElementById('view-day').style.display = 'flex'; renderCurrentView();
      };
      document.getElementById('btn-week').onclick = () => {
        currentView = 'week'; document.getElementById('btn-week').classList.add('active'); document.getElementById('btn-day').classList.remove('active');
        document.getElementById('view-day').style.display = 'none'; document.getElementById('view-week').style.display = 'block'; renderCurrentView();
      };

      function renderCurrentView() {
        updateDateHeaderUI();
        if (currentView === 'week') renderWeekView(); else renderDayView();
      }

      function updateDateHeaderUI() {
        const { dates, monday, sunday } = getWeekDates(currentWeekOffset);
        document.getElementById('week-range-text').textContent = `${monday.toLocaleDateString('ru-RU', {day:'numeric', month:'short'})} – ${sunday.toLocaleDateString('ru-RU', {day:'numeric', month:'short', year:'numeric'})}`;
        document.getElementById('today-date-text').textContent = `Сегодня: ${new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}`;
      }

      function renderWeekView() {
        const { dates } = getWeekDates(currentWeekOffset);
        const headerTr = document.getElementById('week-table-header');
        headerTr.innerHTML = '<th class="time-col"></th>';
        dates.forEach(d => {
          headerTr.innerHTML += `<th class="day-col ${d.isToday ? 'is-today' : ''}"><div class="day-name">${d.name}</div><div class="day-num">${d.num}</div></th>`;
        });

        const tbody = document.getElementById('week-table-body');
        tbody.innerHTML = '';

        slotsConfig.forEach((slot, sIdx) => {
          let tr = document.createElement('tr');
          tr.innerHTML = `<td class="time-cell">${slot.label}</td>`;
          for (let d = 0; d < 7; d++) {
            let td = document.createElement('td');
            td.className = 'slot-cell';
            const slotEvents = events.filter(e => (e.weekOffset ?? 0) === currentWeekOffset && e.day === d && (e.slotIdx ?? 0) === sIdx);
            if (slotEvents.length > 0) {
              let wrapper = document.createElement('div');
              wrapper.className = 'slot-wrapper';
              slotEvents.forEach(ev => {
                let card = document.createElement('div');
                card.className = `grid-card ${ev.color} ${ev.isDone ? 'is-done' : ''}`;
                card.innerHTML = `
                  <div>
                    <div class="card-header-line">
                      <span class="grid-card-time">${ev.timeStr || ''}</span>
                      <input type="checkbox" class="hw-checkbox" ${ev.isDone ? 'checked' : ''} onclick="toggleDoneStatus(${ev.id}, event)">
                    </div>
                    <div class="grid-card-title">${ev.subject}</div>
                    ${ev.location ? `<div class="grid-card-sub">📍 ${ev.location}</div>` : ''}
                    ${ev.homework ? `<div class="hw-badge ${ev.isDone ? 'done' : ''}">📝 ${ev.homework}</div>` : ''}
                  </div>
                  ${ev.link ? `<a href="${ev.link}" target="_blank" class="card-link-btn" onclick="event.stopPropagation()">🔗 Ссылка</a>` : ''}
                `;
                card.onclick = () => openModalForEdit(ev);
                wrapper.appendChild(card);
              });
              td.appendChild(wrapper);
            }
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        });
      }

      function renderDayView() {
        const { dates } = getWeekDates(currentWeekOffset);
        const dayStrip = document.getElementById('day-strip');
        dayStrip.innerHTML = '';
        dates.forEach((d, idx) => {
          dayStrip.innerHTML += `<div class="day-tab ${idx === activeDayIndex ? 'active' : ''}" onclick="activeDayIndex=${idx};renderDayView()"><div class="day-tab-name">${d.name}</div><div class="day-tab-num">${d.num}</div></div>`;
        });

        const container = document.getElementById('day-cards-container');
        container.innerHTML = '';
        const dayEvents = events.filter(e => (e.weekOffset ?? 0) === currentWeekOffset && e.day === activeDayIndex);
        if (dayEvents.length === 0) { container.innerHTML = `<div style="text-align:center; color:#666; padding:40px;">Занятий нет</div>`; return; }

        dayEvents.sort((a,b) => (a.slotIdx ?? 0) - (b.slotIdx ?? 0));
        dayEvents.forEach(ev => {
          container.innerHTML += `
            <div class="day-card ${ev.color} ${ev.isDone ? 'is-done' : ''}" onclick='openModalForEdit(${JSON.stringify(ev)})'>
              <div class="day-card-header">
                <div class="day-card-time">${ev.timeStr || ''}</div>
                <div style="display:flex; align-items:center; gap:8px;">
                  <input type="checkbox" class="hw-checkbox" ${ev.isDone ? 'checked' : ''} onclick="toggleDoneStatus(${ev.id}, event)">
                  <div class="day-card-badge">${ev.pair || 'Пара'}</div>
                </div>
              </div>
              <div class="day-card-title">${ev.subject}</div>
              ${ev.type ? `<div class="day-card-type">${ev.type}</div>` : ''}
              <div class="day-card-info">
                ${ev.location ? `<div class="info-row">📍 <span>${ev.location}</span></div>` : ''}
                ${ev.teacher ? `<div class="info-row">👤 <span>${ev.teacher}</span></div>` : ''}
                ${ev.homework ? `<div class="hw-row ${ev.isDone ? 'done' : ''}"><span>📝 <b>ДЗ:</b> ${ev.homework}</span></div>` : ''}
                ${ev.link ? `<div class="info-row"><a href="${ev.link}" target="_blank" class="card-link-btn" onclick="event.stopPropagation()">🔗 Ссылка</a></div>` : ''}
              </div>
            </div>
          `;
        });
      }

      document.getElementById('btn-add-event').onclick = () => {
        editingEventId = null;
        document.getElementById('modal-heading').textContent = 'Новая пара';
        document.getElementById('btn-delete-event').style.display = 'none';
        document.getElementById('inp-subject').value = '';
        document.getElementById('inp-day').value = activeDayIndex;
        document.getElementById('inp-time-str').value = '10:15 – 11:45';
        document.getElementById('inp-pair').value = '1 пара';
        document.getElementById('inp-type').value = '';
        document.getElementById('inp-location').value = '';
        document.getElementById('inp-teacher').value = '';
        document.getElementById('inp-link').value = '';
        document.getElementById('inp-homework').value = '';
        document.getElementById('modal-add').style.display = 'flex';
      };

      function openModalForEdit(ev) {
        editingEventId = ev.id;
        document.getElementById('modal-heading').textContent = 'Редактировать пару';
        document.getElementById('btn-delete-event').style.display = 'block';
        document.getElementById('inp-subject').value = ev.subject || '';
        document.getElementById('inp-day').value = ev.day;
        document.getElementById('inp-time-str').value = ev.timeStr || '';
        document.getElementById('inp-pair').value = ev.pair || '';
        document.getElementById('inp-type').value = ev.type || '';
        document.getElementById('inp-location').value = ev.location || '';
        document.getElementById('inp-teacher').value = ev.teacher || '';
        document.getElementById('inp-link').value = ev.link || '';
        document.getElementById('inp-homework').value = ev.homework || '';
        document.getElementById('inp-color').value = ev.color || 'green';
        document.getElementById('modal-add').style.display = 'flex';
      }

      document.getElementById('btn-cancel-modal').onclick = () => document.getElementById('modal-add').style.display = 'none';

      document.getElementById('btn-save-event').onclick = () => {
        const subject = document.getElementById('inp-subject').value.trim();
        if (!subject) { alert('Введите название!'); return; }
        const timeStr = document.getElementById('inp-time-str').value.trim();
        const slotIdx = getSlotIndexFromTime(timeStr);

        const formData = {
          weekOffset: currentWeekOffset, subject,
          day: parseInt(document.getElementById('inp-day').value),
          slotIdx, timeStr,
          pair: document.getElementById('inp-pair').value.trim(),
          type: document.getElementById('inp-type').value.trim(),
          location: document.getElementById('inp-location').value.trim(),
          teacher: document.getElementById('inp-teacher').value.trim(),
          link: document.getElementById('inp-link').value.trim(),
          homework: document.getElementById('inp-homework').value.trim(),
          color: document.getElementById('inp-color').value
        };

        if (editingEventId !== null) {
          const idx = events.findIndex(e => e.id === editingEventId);
          if (idx !== -1) events[idx] = { ...events[idx], ...formData };
        } else {
          events.push({ id: Date.now(), isDone: false, ...formData });
        }

        saveEvents();
        document.getElementById('modal-add').style.display = 'none';
        renderCurrentView();
      };

      document.getElementById('btn-delete-event').onclick = () => {
        if (editingEventId !== null && confirm('Удалить?')) {
          events = events.events.filter(e => e.id !== editingEventId);
          saveEvents();
          document.getElementById('modal-add').style.display = 'none';
          renderCurrentView();
        }
      };

      function updateDateTime() {
        const now = new Date();
        document.getElementById('utc5-time').textContent = `UTC+5: ${now.toLocaleTimeString('ru-RU', {timeZone: 'Asia/Yekaterinburg', hour:'2-digit', minute:'2-digit'})}`;
        document.getElementById('utc3-time').textContent = `UTC+3: ${now.toLocaleTimeString('ru-RU', {timeZone: 'Europe/Moscow', hour:'2-digit', minute:'2-digit'})}`;
      }
      setInterval(updateDateTime, 1000);
      updateDateTime();

      updateDatalists();
      renderCurrentView();
    </script>
  </body>
</html>
